<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Kuma AR — monitor totems</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  /* Background lives on html only: MindAR's camera <video> has z-index -2,
     and an opaque body background would paint on top of it. */
  html { background: #0b1020; }
  #ar-container { width: 100%; height: 100%; position: absolute; inset: 0; }
  #hud {
    position: fixed; top: 10px; left: 10px; z-index: 20;
    background: rgba(10, 14, 30, .75); color: #dbe2ff; border: 1px solid #2c3a6b;
    border-radius: 10px; padding: 8px 12px; font-size: 13px; line-height: 1.5; max-width: 75vw;
  }
  #hud .err { color: #ff7b7b; }
  #start-screen {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: radial-gradient(circle at 50% 35%, #16204a, #0b1020 70%); color: #dbe2ff;
  }
  #start-screen h1 { font-size: 22px; margin: 0; font-weight: 600; }
  #start-screen p { margin: 0; font-size: 14px; color: #93a1d6; text-align: center; max-width: 320px; }
  #start-btn {
    font-size: 18px; padding: 14px 36px; border-radius: 999px; border: none; cursor: pointer;
    background: #4ade80; color: #07210f; font-weight: 700;
  }
  #flat-link { color: #8ab4ff; font-size: 13px; }
  #detail {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 25;
    width: min(440px, calc(100vw - 24px)); box-sizing: border-box;
    background: rgba(10, 14, 30, .93); border: 1px solid #2c3a6b; border-radius: 14px;
    color: #dbe2ff; padding: 14px 16px; font-size: 14px; line-height: 1.55;
  }
  #detail-head { display: flex; align-items: center; justify-content: space-between; }
  #detail-name { font-size: 17px; font-weight: 700; }
  #detail-close { background: none; border: none; color: #93a1d6; font-size: 18px; cursor: pointer; padding: 2px 6px; }
  #detail-status { font-weight: 700; margin-top: 2px; }
  #detail-error {
    margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: rgba(239, 68, 68, .12);
    border: 1px solid rgba(239, 68, 68, .4); color: #ffb4b4;
    font-family: ui-monospace, Consolas, monospace; font-size: 13px; word-break: break-word;
  }
  #detail-error.ok { display: none; }
  #detail-meta { margin-top: 8px; color: #93a1d6; font-size: 13px; }
  #detail-recheck {
    margin-top: 10px; width: 100%; padding: 10px; border-radius: 9px; border: none; cursor: pointer;
    background: #2c3a6b; color: #dbe2ff; font-weight: 600; font-size: 14px;
  }
  #ar-toggle {
    position: fixed; right: 12px; top: 12px; z-index: 26;
    padding: 10px 16px; border-radius: 999px; border: 1px solid #2c3a6b; cursor: pointer;
    background: rgba(10, 14, 30, .85); color: #dbe2ff; font-weight: 600; font-size: 14px;
  }
</style>
</head>
<body>
<div id="ar-container"></div>
<div id="hud">starting…</div>
<div id="detail" hidden>
  <div id="detail-head"><span id="detail-name"></span><button id="detail-close">✕</button></div>
  <div id="detail-status"></div>
  <div id="detail-error"></div>
  <div id="detail-meta"></div>
  <button id="detail-recheck">Re-check now</button>
</div>
<button id="ar-toggle" hidden>⏸ Pause scan</button>
<div id="start-screen">
  <h1>Kuma AR</h1>
  <p>Point your camera at the marker card after starting. Live status pops up as 3D totems.</p>
  <button id="start-btn">Start AR</button>
  <a id="flat-link" href="?flat=1">No camera? Open flat 3D preview</a>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const MIND_TARGET = 'https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind';
const HISTORY = 30;          // heartbeats kept per monitor
const POLL_MS = 2000;

const params = new URLSearchParams(location.search);
const FLAT = params.has('flat');                  // desktop preview, no camera
const KUMA_BASE = params.get('base');             // e.g. https://kuma.example.com
const KUMA_SLUG = params.get('slug');             // status page slug
const KUMA_MODE = !!(KUMA_BASE && KUMA_SLUG);

const hud = document.getElementById('hud');
const startScreen = document.getElementById('start-screen');
const setHud = (msg, isErr) => { hud.innerHTML = isErr ? `<span class="err">${msg}</span>` : msg; };

const COLORS = { up: 0x22c55e, down: 0xef4444, pending: 0xf59e0b, unknown: 0x6b7280 };
const statusColor = b => b == null ? COLORS.unknown : (b.ok ? COLORS.up : (b.pending ? COLORS.pending : COLORS.down));

const KIND_LABELS = { api: 'API', db: 'DATABASE', push: 'PUSH', ping: 'PING', dns: 'DNS', tcp: 'TCP PORT' };
// Uptime Kuma monitor type -> visual kind
const KUMA_TYPE_KIND = {
  http: 'api', keyword: 'api', 'json-query': 'api', grpc: 'api',
  mysql: 'db', postgres: 'db', sqlserver: 'db', mongodb: 'db', redis: 'db',
  push: 'push', ping: 'ping', dns: 'dns', port: 'tcp', docker: 'tcp',
};

// ---------- monitors ----------
// Each monitor: { id, name, beats: [{ok, pending, ms}], uptime: 0..1|null, totem }
let monitors = [];

async function initMonitors() {
  if (!KUMA_MODE) {
    // Demo mode: simulated monitors of each Uptime Kuma type, with
    // type-appropriate latency profiles and error messages.
    monitors = [
      { id: 'api',  name: 'orders-api',       kind: 'api',  sim: { base: 120, jitter: 90, errMsg: 'Request failed with status code 503' } },
      { id: 'db',   name: 'postgres-main',    kind: 'db',   sim: { base: 18,  jitter: 14, errMsg: 'connect ECONNREFUSED 10.0.2.15:5432' } },
      { id: 'push', name: 'nightly-backup',   kind: 'push', sim: { base: 6,   jitter: 6,  errMsg: 'no heartbeat received within 60 s grace period' } },
      { id: 'ping', name: 'core-router',      kind: 'ping', sim: { base: 4,   jitter: 5,  errMsg: 'timeout of 2000 ms exceeded (ICMP)' } },
      { id: 'dns',  name: 'internal-dns',     kind: 'dns',  sim: { base: 35,  jitter: 28, errMsg: 'queryA ENOTFOUND api.internal' } },
      { id: 'tcp',  name: 'redis-cache:6379', kind: 'tcp',  sim: { base: 9,   jitter: 7,  errMsg: 'connect ETIMEDOUT 10.0.0.8:6379' } },
    ].map(m => ({ ...m, beats: [], uptime: null, simState: { down: false, left: 0 } }));
    return;
  }
  const cfg = await (await fetch(`${KUMA_BASE}/api/status-page/${KUMA_SLUG}`)).json();
  monitors = (cfg.publicGroupList || []).flatMap(g => g.monitorList || [])
    .map(m => ({ id: m.id, name: m.name, kind: KUMA_TYPE_KIND[m.type] || 'api', beats: [], uptime: null }));
  if (!monitors.length) throw new Error('status page has no monitors');
}

// Fake heartbeat: random latency around the type's profile, with occasional
// multi-beat outages so there's always something to inspect.
function simulateBeat(m) {
  const s = m.simState;
  if (s.down) {
    s.left--;
    if (s.left <= 0) s.down = false;
  } else if (Math.random() < 0.04) {
    s.down = true;
    s.left = 3 + Math.floor(Math.random() * 8);
  }
  const ok = !s.down;
  const spike = Math.random() < 0.07 ? 2.5 : 1;
  const ms = ok ? Math.round((m.sim.base + Math.random() * m.sim.jitter) * spike) : 0;
  return { ok, pending: false, ms, msg: ok ? '' : m.sim.errMsg, at: Date.now() };
}

async function pollOnce() {
  if (KUMA_MODE) {
    const data = await (await fetch(`${KUMA_BASE}/api/status-page/heartbeat/${KUMA_SLUG}`)).json();
    for (const m of monitors) {
      const list = (data.heartbeatList && data.heartbeatList[m.id]) || [];
      m.beats = list.slice(-HISTORY).map(h => ({
        ok: h.status === 1,
        pending: h.status === 2 || h.status === 3,
        ms: h.ping || 0,
        msg: h.msg || '',   // empty unless the fork exposes it (heartbeat.js toPublicJSON)
        at: h.time ? Date.parse(h.time.replace(' ', 'T') + 'Z') : null,
      }));
      const up = data.uptimeList && data.uptimeList[`${m.id}_24`];
      m.uptime = typeof up === 'number' ? up : null;
    }
  } else {
    for (const m of monitors) {
      m.beats.push(simulateBeat(m));
      if (m.beats.length > HISTORY) m.beats.shift();
      m.uptime = m.beats.filter(b => b.ok).length / m.beats.length;
    }
  }
  monitors.forEach(updateTotem);
  if (selectedMonitor) renderDetail(selectedMonitor);
  setHud(`${KUMA_MODE ? 'kuma: ' + KUMA_SLUG : 'demo: simulated monitors'}${FLAT ? ' · FLAT PREVIEW (no camera)' : ''}<br>updated ${new Date().toLocaleTimeString()}<br>tap a totem for details`);
}

// ---------- 3D ----------
function makeLabel() {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 224;
  const texture = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
  sprite.scale.set(0.62, 0.27, 1);
  return { sprite, canvas, texture };
}

function drawLabel(m) {
  const { canvas, texture } = m.totem.label;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'rgba(8, 12, 28, 0.78)';
  ctx.beginPath(); ctx.roundRect(8, 8, canvas.width - 16, canvas.height - 16, 28); ctx.fill();
  const last = m.beats[m.beats.length - 1];
  const color = '#' + statusColor(last).toString(16).padStart(6, '0');
  ctx.textAlign = 'center';
  ctx.font = '600 27px system-ui'; ctx.fillStyle = '#8ab4ff';
  ctx.fillText(KIND_LABELS[m.kind] || 'MONITOR', canvas.width / 2, 44);
  ctx.fillStyle = '#e8ecff'; ctx.font = 'bold 48px system-ui';
  ctx.fillText(m.name, canvas.width / 2, 98);
  ctx.font = '38px system-ui'; ctx.fillStyle = color;
  const statusWord = last == null ? 'waiting…' : (last.ok ? 'UP' : (last.pending ? 'PENDING' : 'DOWN'));
  const ping = last && last.ok ? `  ·  ${last.ms} ms` : '';
  ctx.fillText(statusWord + ping, canvas.width / 2, 148);
  ctx.fillStyle = '#93a1d6';
  ctx.fillText(m.uptime == null ? '' : `uptime ${(m.uptime * 100).toFixed(1)}%`, canvas.width / 2, 196);
  texture.needsUpdate = true;
}

// Distinct 3D shape per monitor type; all status-colored materials are
// collected so updateTotem can recolor every part at once.
function buildStatusShape(kind) {
  const root = new THREE.Group();
  const mats = [];
  const mat = () => {
    const x = new THREE.MeshStandardMaterial({ color: COLORS.unknown, emissive: COLORS.unknown, emissiveIntensity: 0.45, roughness: 0.35 });
    mats.push(x); return x;
  };
  let spin = false;
  if (kind === 'db') {                       // stacked cylinders
    for (let i = 0; i < 3; i++) {
      const disk = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.062, 32), mat());
      disk.position.y = (i - 1) * 0.085;
      root.add(disk);
    }
  } else if (kind === 'push') {              // beacon cone + expanding pulse ring
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.18, 32), mat());
    root.add(cone);
    const ringMat = mat();
    ringMat.transparent = true;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.012, 12, 48), ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = -0.07;
    root.add(ring);
    root.userData.pushRing = ring;
  } else if (kind === 'ping') {              // spinning gem
    root.add(new THREE.Mesh(new THREE.OctahedronGeometry(0.11), mat()));
    spin = true;
  } else if (kind === 'dns') {               // rotating torus
    const torus = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.035, 16, 48), mat());
    root.add(torus);
    spin = true;
  } else if (kind === 'tcp') {               // cube
    root.add(new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.15), mat()));
    spin = true;
  } else {                                   // api: sphere
    root.add(new THREE.Mesh(new THREE.SphereGeometry(0.09, 32, 32), mat()));
  }
  root.position.y = 0.42;
  return { root, mats, spin };
}

function makeTotem(m) {
  const group = new THREE.Group();
  const shape = buildStatusShape(m.kind);

  const bars = [];
  const barGroup = new THREE.Group();
  for (let i = 0; i < HISTORY; i++) {
    const bar = new THREE.Mesh(
      new THREE.BoxGeometry(0.016, 1, 0.016),
      new THREE.MeshStandardMaterial({ color: 0x3a4470 })
    );
    bar.position.x = (i - (HISTORY - 1) / 2) * 0.024;
    bar.scale.y = 0.02; bar.position.y = 0.01;
    barGroup.add(bar); bars.push(bar);
  }

  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.42, 0.42, 0.012, 48),
    new THREE.MeshStandardMaterial({ color: 0x16204a, roughness: 0.8, transparent: true, opacity: 0.55 })
  );
  base.position.y = -0.01;

  const label = makeLabel();
  label.sprite.position.y = 0.70;

  group.add(base, barGroup, shape.root, label.sprite);
  group.userData.monitor = m;
  m.totem = { group, status: shape.root, statusMats: shape.mats, spin: shape.spin, bars, label, baseY: shape.root.position.y };
  return group;
}

function updateTotem(m) {
  if (!m.totem) return;
  const last = m.beats[m.beats.length - 1];
  const c = statusColor(last);
  for (const mat of m.totem.statusMats) { mat.color.setHex(c); mat.emissive.setHex(c); }

  // newest beat on the right
  const maxMs = Math.max(300, ...m.beats.map(b => b.ms || 0));
  for (let i = 0; i < HISTORY; i++) {
    const beat = m.beats[m.beats.length - HISTORY + i];
    const bar = m.totem.bars[i];
    if (!beat) { bar.material.color.setHex(0x3a4470); bar.scale.y = 0.02; bar.position.y = 0.01; continue; }
    const h = beat.ok ? 0.04 + 0.26 * Math.min(1, beat.ms / maxMs) : 0.30;
    bar.scale.y = h; bar.position.y = h / 2;
    bar.material.color.setHex(statusColor(beat));
  }
  drawLabel(m);
}

function buildScene(parent) {
  const n = monitors.length;
  const cols = Math.min(3, n);
  monitors.forEach((m, i) => {
    const totem = makeTotem(m);
    const col = i % cols, row = Math.floor(i / cols);
    totem.position.x = (col - (cols - 1) / 2) * 0.95;
    totem.position.z = row * -0.95;
    parent.add(totem);
    drawLabel(m);
  });
}

function addLights(scene) {
  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const dir = new THREE.DirectionalLight(0xffffff, 1.4);
  dir.position.set(0.5, 1, 1);
  scene.add(dir);
}

// ---------- tap-to-inspect ----------
let selectedMonitor = null;
let activeRenderer = null, activeCamera = null;
const raycaster = new THREE.Raycaster();
const detailEl = document.getElementById('detail');

function enablePicking(renderer, camera) {
  activeRenderer = renderer; activeCamera = camera;
  // Listen on window, not the canvas: in AR mode MindAR layers its camera
  // <video> above the canvas and would swallow taps.
  window.addEventListener('pointerdown', onPick);
}

function onPick(e) {
  if (e.target.closest && e.target.closest('#detail, #hud, #start-screen, #ar-toggle')) return;
  const rect = activeRenderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(ndc, activeCamera);
  const groups = monitors.filter(m => m.totem).map(m => m.totem.group);
  const hits = raycaster.intersectObjects(groups, true);
  if (!hits.length) return;
  let obj = hits[0].object;
  while (obj && !obj.userData.monitor) obj = obj.parent;
  if (obj) { selectedMonitor = obj.userData.monitor; renderDetail(selectedMonitor); detailEl.hidden = false; }
}

function fmtDuration(ms) {
  const s = Math.round(ms / 1000);
  if (s < 90) return `${s} s`;
  const min = Math.round(s / 60);
  if (min < 90) return `${min} min`;
  return `${(min / 60).toFixed(1)} h`;
}

// Length of the current DOWN streak, from the beat history window.
function downSince(m) {
  const beats = m.beats;
  if (!beats.length || beats[beats.length - 1].ok) return null;
  let i = beats.length - 1;
  while (i > 0 && !beats[i - 1].ok) i--;
  const startedAt = beats[i].at;
  if (!startedAt) return null;
  const prefix = i === 0 ? '≥ ' : '';      // whole window is down — actual start is older
  return prefix + fmtDuration(Date.now() - startedAt);
}

function renderDetail(m) {
  const last = m.beats[m.beats.length - 1];
  const color = '#' + statusColor(last).toString(16).padStart(6, '0');
  document.getElementById('detail-name').textContent = m.name;
  const statusEl = document.getElementById('detail-status');
  statusEl.style.color = color;
  statusEl.textContent = last == null ? 'waiting for first check…' : (last.ok ? `UP · ${last.ms} ms` : (last.pending ? 'PENDING / MAINTENANCE' : 'DOWN'));

  const errEl = document.getElementById('detail-error');
  const isDown = last && !last.ok && !last.pending;
  errEl.classList.toggle('ok', !isDown);
  if (isDown) {
    errEl.textContent = last.msg
      || (KUMA_MODE ? 'no error message — expose msg in toPublicJSON() (server/model/heartbeat.js) in your fork to see it here' : 'no error details available');
  }

  const parts = [KIND_LABELS[m.kind] || 'MONITOR'];
  const ds = downSince(m);
  if (ds) parts.push(`down for ${ds}`);
  if (m.uptime != null) parts.push(`uptime ${(m.uptime * 100).toFixed(1)}%`);
  parts.push(`${m.beats.length} checks in window`);
  document.getElementById('detail-meta').textContent = parts.join('  ·  ');
}

document.getElementById('detail-close').onclick = () => { detailEl.hidden = true; selectedMonitor = null; };
document.getElementById('detail-recheck').onclick = e => {
  e.target.disabled = true;
  pollOnce().catch(err => setHud('poll failed: ' + err.message, true)).finally(() => { e.target.disabled = false; });
};

const clock = new THREE.Clock();
function animateTotems() {
  const t = clock.getElapsedTime();
  for (const m of monitors) {
    if (!m.totem) continue;
    const last = m.beats[m.beats.length - 1];
    const down = last && !last.ok && !last.pending;
    const pulse = down ? 1 + 0.18 * Math.sin(t * 7) : 1 + 0.03 * Math.sin(t * 2);
    m.totem.status.scale.setScalar(pulse);
    m.totem.status.position.y = m.totem.baseY + 0.012 * Math.sin(t * 1.5);
    if (m.totem.spin) m.totem.status.rotation.y = t * 0.8;
    const ring = m.totem.status.userData.pushRing;
    if (ring) {                       // push monitor: ring expands outward and fades
      const phase = (t * (down ? 2.5 : 0.8)) % 1;
      ring.scale.setScalar(0.8 + phase * 1.4);
      ring.material.opacity = 1 - phase;
    }
  }
}

// ---------- bootstrap ----------
async function startFlat() {
  startScreen.style.display = 'none';
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  document.getElementById('ar-container').appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1020);
  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.01, 50);
  camera.position.set(0, 1.0, 2.3);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.3, -0.45);
  addLights(scene);
  buildScene(scene);
  enablePicking(renderer, camera);
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  renderer.setAnimationLoop(() => { animateTotems(); controls.update(); renderer.render(scene, camera); });
}

async function startAR() {
  // Browsers only allow camera access on secure origins; MindAR's own error
  // screen for this case misleadingly says the device is incompatible.
  if (!window.isSecureContext || !navigator.mediaDevices) {
    setHud(`Camera blocked: this page was opened over HTTP (${location.origin}).<br>` +
      'Phones need HTTPS — use a tunnel (cloudflared/ngrok) or host the file on HTTPS, then reopen.', true);
    startScreen.style.display = 'none';
    return;
  }
  startScreen.style.display = 'none';
  setHud('loading AR engine…');
  const { MindARThree } = await import('mindar-image-three');
  const mindar = new MindARThree({
    container: document.getElementById('ar-container'),
    imageTargetSrc: MIND_TARGET,
    uiScanning: 'no',   // no dimming overlay — keep the real world fully visible
  });
  const { renderer, scene, camera } = mindar;
  addLights(scene);
  const anchor = mindar.addAnchor(0);
  const world = new THREE.Group();
  world.scale.setScalar(0.7);   // two rows of totems need to fit over the card
  anchor.group.add(world);
  buildScene(world);
  enablePicking(renderer, camera);
  anchor.onTargetFound = () => setHud('marker locked — tap a totem for details');
  anchor.onTargetLost = () => setHud('scanning for marker…');
  const runLoop = () => renderer.setAnimationLoop(() => { animateTotems(); renderer.render(scene, camera); });
  await mindar.start();
  runLoop();
  setHud('scanning for marker…');

  const toggleBtn = document.getElementById('ar-toggle');
  toggleBtn.hidden = false;
  let scanning = true;
  toggleBtn.onclick = async () => {
    toggleBtn.disabled = true;
    try {
      if (scanning) {
        mindar.stop();
        renderer.setAnimationLoop(null);
        toggleBtn.textContent = '▶ Resume scan';
        setHud('camera paused');
      } else {
        await mindar.start();
        runLoop();
        toggleBtn.textContent = '⏸ Pause scan';
        setHud('scanning for marker…');
      }
      scanning = !scanning;
    } catch (err) {
      setHud('toggle failed: ' + err.message, true);
    } finally {
      toggleBtn.disabled = false;
    }
  };
}

(async () => {
  try {
    setHud('loading monitors…');
    await initMonitors();
    pollOnce().catch(e => setHud('poll failed: ' + e.message, true));
    setInterval(() => pollOnce().catch(e => setHud('poll failed: ' + e.message, true)), POLL_MS);
    if (FLAT) {
      await startFlat();
    } else {
      document.getElementById('start-btn').onclick = () => startAR().catch(e => setHud('AR failed: ' + e.message, true));
    }
  } catch (e) {
    setHud('init failed: ' + e.message, true);
  }
})();
</script>
</body>
