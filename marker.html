<!DOCTYPE html>
<html lang="en">

<title>Kuma AR — marker card</title>

  html, body { margin: 0; height: 100%; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-family: system-ui, sans-serif; }
